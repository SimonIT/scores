<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>scores-web</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    select, input[type="file"] { display: block; margin-top: 0.25rem; }
    button { margin-top: 1.5rem; padding: 0.5rem 1.25rem; font-size: 1rem; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.6; }
    #status { margin-top: 1rem; white-space: pre-wrap; }
    #status.error { color: #b00020; }
    #result { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>scores-web: convert a music score in the browser</h1>
  <p>Runs entirely client-side via WebAssembly - nothing is uploaded anywhere.</p>

  <label for="file">Score file</label>
  <input type="file" id="file" />

  <label for="from">Convert from</label>
  <select id="from"></select>

  <label for="to">Convert to</label>
  <select id="to"></select>

  <button id="convert" disabled>Convert</button>

  <div id="status"></div>
  <div id="result"></div>

  <script type="module">
    import init, { convert, list_formats } from "./pkg/scores_web.js";

    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const fileEl = document.getElementById("file");
    const fromEl = document.getElementById("from");
    const toEl = document.getElementById("to");
    const buttonEl = document.getElementById("convert");

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? "error" : "";
    }

    function extensionOf(name) {
      const dot = name.lastIndexOf(".");
      return dot === -1 ? "" : name.slice(dot + 1).toLowerCase();
    }

    async function main() {
      setStatus("Loading WebAssembly module...");
      await init();

      const formats = JSON.parse(list_formats());
      for (const select of [fromEl, toEl]) {
        select.innerHTML = "";
        for (const format of formats) {
          const option = document.createElement("option");
          option.value = format.id;
          option.textContent = `${format.name} (.${format.extensions[0]})`;
          select.appendChild(option);
        }
      }
      toEl.selectedIndex = Math.min(1, formats.length - 1);

      fileEl.addEventListener("change", () => {
        const file = fileEl.files[0];
        buttonEl.disabled = !file;
        if (!file) return;

        const extension = extensionOf(file.name);
        const match = formats.find((f) => f.extensions.includes(extension));
        if (match) fromEl.value = match.id;
      });

      buttonEl.addEventListener("click", async () => {
        const file = fileEl.files[0];
        if (!file) return;

        resultEl.innerHTML = "";
        setStatus("Converting...");
        try {
          const input = new Uint8Array(await file.arrayBuffer());
          const from = fromEl.value;
          const to = toEl.value;
          const output = convert(input, from, to);

          const toFormat = formats.find((f) => f.id === to);
          const outName = file.name.replace(/\.[^.]+$/, "") + "." + (toFormat?.extensions[0] ?? to);
          const blob = new Blob([output], { type: "application/octet-stream" });
          const url = URL.createObjectURL(blob);

          const link = document.createElement("a");
          link.href = url;
          link.download = outName;
          link.textContent = `Download ${outName} (${output.length} bytes)`;
          resultEl.appendChild(link);

          setStatus(`Converted ${file.name} (${from}) -> ${outName} (${to}).`);
        } catch (err) {
          setStatus(String(err), true);
        }
      });

      setStatus("Ready. Choose a file to convert.");
    }

    main().catch((err) => setStatus(String(err), true));
  </script>
</body>
</html>
